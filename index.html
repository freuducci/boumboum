<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Port-au-Prince's premier cinematic photo studio. Professional photography for weddings, portraits, events, and marketing campaigns.">
  <title>Haitian Hub Studio | Frame the Culture. Capture the Vibe.</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📸</text></svg>">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
  
  <style>
    /* ============================================
       RESET & BASE STYLES
       ============================================ */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      font-size: 16px;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #000;
      color: #fff;
      overflow-x: hidden;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    /* ============================================
       CSS VARIABLES
       ============================================ */
    :root {
      --color-red: #e50914;
      --color-red-dark: #b20710;
      --color-black: #0a0a0a;
      --color-gray: #141414;
      --color-gray-800: #1a1a1a;
      --color-gray-900: #0d0d0d;
      --color-light: #e5e5e5;
      --color-gold: #f5c518;
      --color-green: #16a34a;
      --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --container-width: 90%;
      --container-max: 1400px;
    }

    /* ============================================
       TYPOGRAPHY
       ============================================ */
    .font-bebas {
      font-family: 'Bebas Neue', cursive;
      letter-spacing: 0.05em;
    }

    .font-inter {
      font-family: 'Inter', sans-serif;
    }

    /* ============================================
       LAYOUT UTILITIES
       ============================================ */
    .container {
      width: var(--container-width);
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 1rem;
    }

    section {
      padding: 4rem 0;
    }

    @media (min-width: 768px) {
      section {
        padding: 6rem 0;
      }
    }

    /* ============================================
       BUTTONS
       ============================================ */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.875rem 2rem;
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 4px;
      border: none;
      transition: all 0.3s var(--ease);
      cursor: pointer;
      text-align: center;
    }

    .btn-red {
      background: var(--color-red);
      color: #fff;
    }

    .btn-red:hover {
      background: var(--color-red-dark);
      transform: translateY(-2px);
    }

    .btn-outline {
      border: 1px solid var(--color-light);
      color: var(--color-light);
      background: transparent;
    }

    .btn-outline:hover {
      background: var(--color-light);
      color: var(--color-black);
    }

    /* ============================================
       NAVIGATION
       ============================================ */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 50;
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 0;
    }

    .logo {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--color-red);
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      gap: 2.2rem;
      align-items: center;
    }

    .nav-links a {
      color: var(--color-light);
      font-weight: 500;
      position: relative;
      font-size: 0.95rem;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--color-red);
      transition: width 0.3s var(--ease);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      z-index: 60;
    }

    .hamburger span {
      width: 28px;
      height: 2px;
      background: #fff;
      transition: 0.3s var(--ease);
    }

    /* Mobile Navigation */
    @media (max-width: 768px) {
      .logo {
        font-size: 1.2rem;
      }

      .nav-links {
        position: fixed;
        top: 0;
        right: 0;
        height: 100vh;
        width: 70%;
        max-width: 280px;
        background: #000;
        flex-direction: column;
        align-items: flex-start;
        padding: 6rem 2rem 2rem;
        gap: 1.8rem;
        transform: translateX(100%);
        transition: transform 0.4s var(--ease);
      }

      .nav-links.open {
        transform: translateX(0);
      }

      .hamburger {
        display: flex;
      }
    }

    /* ============================================
       HERO SECTION
       ============================================ */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #000;
      overflow: hidden;
      padding-top: 80px;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('http://static.photos/studio/1920x1080/42') center/cover no-repeat;
      opacity: 0.18;
      filter: blur(2px);
    }

    .hero-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .hero::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        135deg,
        rgba(229, 9, 20, 0.15) 0%,
        rgba(10, 10, 10, 0.7) 40%,
        rgba(10, 10, 10, 0.9) 100%
      );
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 1000px;
      padding: 0 1rem;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 9999px;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      font-weight: 500;
      color: #e5e5e5;
      margin-bottom: 1.5rem;
    }

    .hero-badge-pulse {
      width: 8px;
      height: 8px;
      background: var(--color-red);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.5;
        transform: scale(1.2);
      }
    }

    .hero h1 {
      font-size: clamp(2rem, 10vw, 7rem);
      font-weight: 900;
      line-height: 0.95;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      position: relative;
      display: inline-block;
    }

    .hero h1 span {
      display: block;
    }

    .hero h1 span:first-child {
      color: #fff;
    }

    .hero h1 span:last-child {
      color: var(--color-red);
    }

    .hero h1::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 4px;
      background: var(--color-red);
      border-radius: 2px;
    }

    .hero p {
      font-size: clamp(0.95rem, 2vw, 1.25rem);
      color: var(--color-light);
      margin: 1.5rem auto 2.5rem;
      max-width: 680px;
      line-height: 1.6;
    }

    .hero-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2.5rem;
    }

    .hero-stats {
      display: flex;
      gap: 2rem;
      justify-content: center;
      font-size: 0.85rem;
      color: var(--color-light);
      flex-wrap: wrap;
    }

    .hero-stats div {
      text-align: center;
      min-width: 80px;
    }

    .hero-stats strong {
      display: block;
      font-size: 1.8rem;
      color: var(--color-gold);
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    @media (max-width: 480px) {
      .hero-buttons {
        flex-direction: column;
        align-items: center;
      }

      .hero-buttons .btn {
        width: 100%;
        max-width: 280px;
      }
    }

    /* ============================================
       BANNER SECTION
       ============================================ */
    .banner {
      background: linear-gradient(135deg, var(--color-red) 0%, var(--color-green) 100%);
      padding: 3rem 0;
    }

    .banner h2 {
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      color: #fff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
      margin-bottom: 0.75rem;
    }

    .banner p {
      color: rgba(255, 255, 255, 0.95);
      max-width: 600px;
      margin: 0 auto 1.5rem;
    }

    .banner .btn-outline {
      border-color: #fff;
      color: #fff;
    }

    .banner .btn-outline:hover {
      background: #fff;
      color: var(--color-red);
    }

    /* ============================================
       SECTION TITLES
       ============================================ */
    .section-title {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 900;
      margin-bottom: 3rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: -1px;
    }

    .section-title span {
      color: var(--color-red);
    }

    /* ============================================
       ABOUT SECTION
       ============================================ */
    #about {
      background: linear-gradient(135deg, var(--color-black) 0%, var(--color-gray-900) 100%);
      position: relative;
    }

    #about::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('http://static.photos/textures/1920x1080/7') center/cover no-repeat;
      opacity: 0.04;
      pointer-events: none;
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 3rem;
      align-items: center;
    }

    @media (min-width: 768px) {
      .about-grid {
        grid-template-columns: 1fr 1fr;
        gap: 4rem;
      }
    }

    .about-image {
      position: relative;
    }

    .about-image img {
      border-radius: 12px;
      box-shadow: 0 25px 50px -12px rgba(229, 9, 20, 0.25);
      transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease);
      width: 100%;
    }

    .about-image img:hover {
      transform: scale(1.02) rotate(-1deg);
      box-shadow: 0 30px 60px -12px rgba(229, 9, 20, 0.35);
    }

    .about-text p {
      color: #d1d1d1;
      margin-bottom: 1.5rem;
      font-size: 1rem;
      line-height: 1.7;
      position: relative;
      padding-left: 1rem;
      border-left: 2px solid var(--color-red);
    }

    .about-text .btn-outline {
      margin-top: 1rem;
      border-color: var(--color-red);
      color: var(--color-red);
    }

    .about-text .btn-outline:hover {
      background: var(--color-red);
      color: #fff;
    }

    /* ============================================
       SPECIALTIES SECTION
       ============================================ */
    #specialties {
      background: var(--color-gray-900);
    }

    .specialties-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .specialty-card {
      background: var(--color-gray);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 1.5rem;
      transition: all 0.3s var(--ease);
      display: block;
    }

    .specialty-card:hover {
      border-color: var(--color-red);
      transform: translateY(-4px);
    }

    .specialty-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 1rem;
    }

    .specialty-card h3 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.5rem;
    }

    .specialty-card p {
      font-size: 0.9rem;
      color: #b3b3b3;
    }

    /* ============================================
       GALLERY SECTION
       ============================================ */
    #gallery {
      background: var(--color-gray-900);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1rem;
    }

    .gallery-item {
      overflow: hidden;
      border-radius: 6px;
      position: relative;
      display: block;
      background: #000;
      aspect-ratio: 4/3;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s var(--ease), opacity 0.5s var(--ease);
    }

    .gallery-item:hover img {
      transform: scale(1.08);
      opacity: 0.75;
    }

    .gallery-item::after {
      content: '＋';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      font-size: 2rem;
      color: #fff;
      opacity: 0;
      transition: opacity 0.3s var(--ease), transform 0.3s var(--ease);
    }

    .gallery-item:hover::after {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* ============================================
       PRICING SECTION
       ============================================ */
    #pricing {
      background: var(--color-gray-900);
    }

    .pricing-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (min-width: 768px) {
      .pricing-grid {
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      }
    }

    .price-card {
      background: var(--color-gray);
      border-radius: 8px;
      padding: 2rem 1.5rem;
      position: relative;
      transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
    }

    .price-card.featured {
      border: 2px solid var(--color-gold);
      transform: scale(1.02);
    }

    .price-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(245, 197, 24, 0.15);
    }

    .price-card h3 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .price-card .price {
      font-size: 2.5rem;
      font-weight: 900;
      color: var(--color-gold);
      margin: 0.5rem 0 1.5rem;
    }

    .price-card ul {
      list-style: none;
      margin-bottom: 2rem;
      font-size: 0.9rem;
      color: var(--color-light);
    }

    .price-card ul li {
      margin: 0.5rem 0;
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
    }

    .price-card ul li::before {
      content: '✓';
      color: var(--color-gold);
      font-weight: 700;
      flex-shrink: 0;
    }

    /* ============================================
       TEAM SECTION
       ============================================ */
    #team {
      background: var(--color-gray-900);
    }

    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem;
    }

    .team-card {
      background: var(--color-gray);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 2rem 1.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: all 0.3s var(--ease);
    }

    .team-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(229, 9, 20, 0.2), transparent);
      opacity: 0;
      transition: opacity 0.3s var(--ease);
    }

    .team-card:hover {
      border-color: var(--color-red);
    }

    .team-card:hover::before {
      opacity: 1;
    }

    .team-card img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 1rem;
      border: 4px solid rgba(255, 255, 255, 0.08);
      transition: border-color 0.3s var(--ease);
    }

    .team-card:hover img {
      border-color: var(--color-red);
    }

    .team-card h3 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.25rem;
    }

    .team-card .role {
      color: var(--color-red);
      font-size: 0.9rem;
      margin-bottom: 0.75rem;
      font-weight: 500;
    }

    .team-card p {
      font-size: 0.85rem;
      color: #b3b3b3;
      line-height: 1.5;
    }

    .team-social {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1rem;
      opacity: 0;
      transition: opacity 0.3s var(--ease);
    }

    .team-card:hover .team-social {
      opacity: 1;
    }

    .team-social a {
      color: #999;
      transition: color 0.3s var(--ease);
    }

    .team-social a:hover {
      color: #fff;
    }

    /* ============================================
       CONTACT SECTION
       ============================================ */
    #contact {
      background: var(--color-gray-900);
    }

    .contact-intro {
      text-align: center;
      margin-bottom: 3rem;
      max-width: 700px;
      margin-left: auto;
      margin-right: auto;
    }

    .contact-intro p {
      color: #b3b3b3;
      font-size: 1rem;
      line-height: 1.6;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (min-width: 900px) {
      .contact-grid {
        grid-template-columns: 2fr 3fr;
        gap: 3rem;
      }
    }

    .contact-info {
      background: var(--color-gray);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 2rem;
    }

    .contact-item {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .contact-item:last-child {
      margin-bottom: 0;
    }

    .contact-icon {
      width: 44px;
      height: 44px;
      background: var(--color-red);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .contact-icon svg {
      width: 20px;
      height: 20px;
      color: #fff;
    }

    .contact-details h4 {
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.25rem;
      font-size: 1rem;
    }

    .contact-details p,
    .contact-details a {
      color: #b3b3b3;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .contact-details a:hover {
      color: var(--color-red);
    }

    .map-container {
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-top: 1.5rem;
    }

    .map-container iframe {
      width: 100%;
      height: 280px;
      border: 0;
    }

    .contact-form {
      background: var(--color-gray);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 2rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    @media (min-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full-width {
      grid-column: 1 / -1;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 0.875rem 1rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: #fff;
      font-size: 0.95rem;
      font-family: inherit;
      transition: border-color 0.3s var(--ease);
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: var(--color-red);
      outline: none;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 140px;
    }

    .form-group select {
      cursor: pointer;
    }

    /* ============================================
       FOOTER
       ============================================ */
    footer {
      padding: 2rem 0;
      background: var(--color-black);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    footer p {
      color: #666;
      font-size: 0.875rem;
      text-align: center;
    }

    /* ============================================
       ANIMATIONS
       ============================================ */
    .fade-up {
      opacity: 0;
      transform: translateY(30px);
